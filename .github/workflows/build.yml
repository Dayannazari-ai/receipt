name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create android scaffold
        run: flutter create --platforms=android --project-name receipt_app .
      - name: Add RECORD_AUDIO permission for speech_to_text
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'RECORD_AUDIO' "$MANIFEST" || sed -i '/<manifest /a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
      - name: Add CAMERA permission for mobile_scanner
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MANIFEST" || sed -i '/<manifest /a\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          echo "---- manifest permissions ----"
          grep 'uses-permission' "$MANIFEST"
      - name: Add storage permissions for backup folder access
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'MANAGE_EXTERNAL_STORAGE' "$MANIFEST" || sed -i '/<manifest /a\    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' "$MANIFEST"
          grep -q 'WRITE_EXTERNAL_STORAGE' "$MANIFEST" || sed -i '/<manifest /a\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />' "$MANIFEST"
          grep -q 'READ_EXTERNAL_STORAGE' "$MANIFEST" || sed -i '/<manifest /a\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' "$MANIFEST"
          grep -q 'requestLegacyExternalStorage' "$MANIFEST" || sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/' "$MANIFEST"
          echo "---- manifest storage lines ----"
          grep -E 'EXTERNAL_STORAGE|requestLegacy' "$MANIFEST"
      - name: Get packages
        run: flutter pub get
      - name: Force compileSdk 36 everywhere
        run: |
          patch_gradle() {
            f="$1"
            if [ -f "$f" ]; then
              sed -i -E 's/^([[:space:]]*)compileSdk(Version)?[[:space:]]+[0-9]+/\1compileSdk 36/' "$f"
              sed -i -E 's/^([[:space:]]*)compileSdk[[:space:]]*=.*/\1compileSdk = 36/' "$f"
            fi
          }
          patch_gradle android/app/build.gradle
          patch_gradle android/app/build.gradle.kts
          for dir in $(find ~/.pub-cache/hosted/pub.dev -maxdepth 1 -type d -name "*-*"); do
            patch_gradle "$dir/android/build.gradle"
            patch_gradle "$dir/android/build.gradle.kts"
          done
          echo "Patch step completed successfully"
      - name: Disable minify/shrink in release (diagnostic fix)
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] || continue
            if [[ "$f" == *.kts ]]; then
              sed -i -E 's/^([[:space:]]*)signingConfig = signingConfigs.getByName\("debug"\)/&\n\1isMinifyEnabled = false\n\1isShrinkResources = false/' "$f"
            else
              sed -i -E 's/^([[:space:]]*)signingConfig signingConfigs.debug/&\n\1minifyEnabled false\n\1shrinkResources false/' "$f"
            fi
            echo "---- $f (buildTypes) ----"
            sed -n '/buildTypes/,/^    }/p' "$f"
          done
      - name: Build APK
        run: flutter build apk --release --no-shrink --build-number=${{ github.run_number }}
      - name: Check R8 mapping (diagnostic)
        run: |
          ls -la build/app/outputs/mapping/release 2>&1 || echo "no mapping dir - R8 did not run"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: receipt-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Build APK (debug, diagnostic)
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: receipt-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
