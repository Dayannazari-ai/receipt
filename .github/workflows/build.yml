name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create android scaffold
        run: flutter create --platforms=android --project-name receipt_app .
      - name: Get packages
        run: flutter pub get
      - name: Show actual file_picker gradle file
        run: |
          FP_DIR=$(find ~/.pub-cache/hosted/pub.dev -maxdepth 1 -type d -name "file_picker-*" | head -n1)
          echo "=== FILE LIST ==="
          find "$FP_DIR/android" -maxdepth 1 -type f
          echo "=== build.gradle (groovy) if exists ==="
          cat "$FP_DIR/android/build.gradle" 2>/dev/null || echo "(none)"
          echo "=== build.gradle.kts if exists ==="
          cat "$FP_DIR/android/build.gradle.kts" 2>/dev/null || echo "(none)"
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: receipt-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
