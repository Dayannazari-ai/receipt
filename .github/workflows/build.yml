name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create android scaffold
        run: flutter create --platforms=android --project-name receipt_app .
      - name: Add RECORD_AUDIO permission for speech_to_text
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'RECORD_AUDIO' "$MANIFEST" || sed -i '/<manifest /a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
      - name: Get packages
        run: flutter pub get
      - name: Force compileSdk 36 everywhere
        run: |
          patch_gradle() {
            f="$1"
            if [ -f "$f" ]; then
              sed -i -E 's/^([[:space:]]*)compileSdk(Version)?[[:space:]]+[0-9]+/\1compileSdk 36/' "$f"
              sed -i -E 's/^([[:space:]]*)compileSdk[[:space:]]*=.*/\1compileSdk = 36/' "$f"
            fi
          }
          patch_gradle android/app/build.gradle
          patch_gradle android/app/build.gradle.kts
          for dir in $(find ~/.pub-cache/hosted/pub.dev -maxdepth 1 -type d -name "*-*"); do
            patch_gradle "$dir/android/build.gradle"
            patch_gradle "$dir/android/build.gradle.kts"
          done
          echo "Patch step completed successfully"
      - name: Patch pdfrx_engine nullable cache access
        run: |
          f=$(find ~/.pub-cache/hosted/pub.dev -path "*pdfrx_engine-*/lib/src/native/pdf_file_cache.dart" | head -n 1)
          if [ -n "$f" ]; then
            sed -i -e 's/\bcache\.blockSize/cache!.blockSize/g' -e 's/await cache\.read(/await cache!.read(/g' "$f"
            echo "Patched $f"
            grep -n "cache!" "$f" || { echo "PATCH DID NOT MATCH"; exit 1; }
          else
            echo "pdf_file_cache.dart not found"
            exit 1
          fi
      - name: Print pdfrx_engine text API (diagnostic)
        run: |
          t=$(grep -rl "class PdfPageRawText" ~/.pub-cache/hosted/pub.dev/ --include=*.dart | head -n 1)
          echo "FILE: $t"
          grep -n -A25 "class PdfPageRawText" "$t" || true
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: receipt-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
