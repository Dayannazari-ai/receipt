name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create android scaffold
        run: flutter create --platforms=android --project-name receipt_app .
      - name: Fix compileSdk version
        run: |
          FILE=$(find android/app -maxdepth 1 -name "build.gradle*" | head -n1)
          sed -i -E 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' "$FILE"
          sed -i -E 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' "$FILE"
          sed -i -E 's/compileSdk = [0-9]+/compileSdk = 36/' "$FILE"
          sed -i -E 's/compileSdkVersion [0-9]+/compileSdkVersion 36/' "$FILE"
      - name: Get packages
        run: flutter pub get
      - name: Patch all plugins compileSdk
        run: |
          find ~/.pub-cache/hosted/pub.dev -maxdepth 1 -type d -name "*-*" | while read -r dir; do
            for f in "$dir/android/build.gradle" "$dir/android/build.gradle.kts"; do
              if [ -f "$f" ]; then
                sed -i -E 's/compileSdkVersion [0-9]+/compileSdkVersion 36/' "$f"
                sed -i -E 's/compileSdk = [0-9]+/compileSdk = 36/' "$f"
                sed -i -E 's/compileSdk\.set\([0-9]+\)/compileSdk.set(36)/' "$f"
              fi
            done
          done
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: receipt-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
