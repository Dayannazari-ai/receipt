name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create android scaffold
        run: flutter create --platforms=android --project-name receipt_app .
      - name: Get packages
        run: flutter pub get
      - name: Force compileSdk 36 everywhere
        run: |
          patch_gradle() {
            f="$1"
            sed -i -E 's/^([[:space:]]*)compileSdk(Version)?[[:space:]]+[0-9]+/\1compileSdk 36/' "$f"
            sed -i -E 's/^([[:space:]]*)compileSdk[[:space:]]*=.*/\1compileSdk = 36/' "$f"
          }
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && patch_gradle "$f"
          done
          find ~/.pub-cache/hosted/pub.dev -maxdepth 1 -type d -name "*-*" | while read -r dir; do
            for f in "$dir/android/build.gradle" "$dir/android/build.gradle.kts"; do
              [ -f "$f" ] && patch_gradle "$f"
            done
          done
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: receipt-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
