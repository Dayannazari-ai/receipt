name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create android scaffold
        run: flutter create --platforms=android --project-name receipt_app .
      - name: Force compileSdk 36 for all subprojects (app + all plugins)
        run: |
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts << 'KTEOF'

subprojects {
    afterEvaluate {
        extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.let {
            it.compileSdkVersion(36)
        }
    }
}
KTEOF
          else
            cat >> android/build.gradle << 'GREOF'

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 36
            }
        }
    }
}
GREOF
          fi
      - name: Get packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: receipt-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
