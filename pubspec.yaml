name: receipt_app
description: "برنامه مدیریت رسید، فاکتور و انبار"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # PDF generation & printing
  pdf: ^3.10.7
  printing: ^5.11.1

  # File sharing (backup export only - no file picking, avoids Android SDK version conflicts)
  share_plus: ^10.0.0

  # Persian (Jalali) date support
  shamsi_date: ^1.1.1
  persian_datetime_picker: ^3.1.0

  # Formatting numbers with thousands separators
  intl: any

  # Excel import (pure-Dart, no native Android code - safe from SDK version conflicts)
  excel: ^4.0.6
  file_picker: ^9.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  # فونت فارسی: فایل‌های زیر را در assets/fonts قرار دهید تا PDF فارسی درست رندر شود
  # fonts:
  #   - family: Vazirmatn
  #     fonts:
  #       - asset: assets/fonts/Vazirmatn-Regular.ttf
  #       - asset: assets/fonts/Vazirmatn-Bold.ttf
  #         weight: 700
  assets:
    - assets/
    - assets/fonts/
